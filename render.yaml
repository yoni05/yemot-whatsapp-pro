services:
  - type: web
    name: yemot-whatsapp-pro
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: YEMOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: TZINTUK_PHONE
        sync: false
